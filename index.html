<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>title>titl>ti
    
    <link rel="stylesheet" href="https://res.wx.qq.com/open/libs/weui/2.4.4/weui.min.css">
    
    <style>
        /* --- 全局样式重置与适配 --- */
        body {
            background-color: #f7f7f7; /* 微信标志性浅灰背景 */
            font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", STHeiti, "Microsoft Yahei", Tahoma, Simsun, sans-serif;
            color: rgba(0, 0, 0, 0.9);
        }

        /* --- PC 端布局容器 --- */
        .pc-container {
            max-width: 960px; /* 限制最大宽度，模拟公众号PC版宽度 */
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
        }

        /* --- 顶部导航栏 --- */
        .header {
            padding: 20px 40px;
            border-bottom: 1px solid #ededed;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header .logo {
            font-size: 20px;
            font-weight: 600;
            color: #07C160; /* 微信绿 */
            display: flex;
            align-items: center;
        }
        .header .nav a {
            margin-left: 30px;
            text-decoration: none;
            color: #666;
            font-size: 15px;
            transition: color 0.3s;
        }
        .header .nav a:hover, .header .nav a.active {
            color: #07C160;
        }

        /* --- 主要内容区域 --- */
        .main-content {
            padding: 40px;
            flex: 1;
            display: flex;
            gap: 40px;
        }

        /* 左侧文章区域 */
        .article-area {
            flex: 2;
        }
        
        /* 右侧侧边栏 (PC特有) */
        .sidebar {
            flex: 1;
            padding-left: 20px;
            border-left: 1px solid #f0f0f0;
        }

        /* --- 模块组件样式 --- */
        .section-title {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 20px;
            line-height: 1.4;
        }
        
        .card {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f5f5f5;
        }
        .card-meta {
            font-size: 13px;
            color: #999;
            margin-bottom: 10px;
        }
        .card p {
            line-height: 1.8;
            color: #333;
            font-size: 16px;
            text-align: justify;
        }

        /* 二维码卡片 (微信PC页标配) */
        .qr-box {
            background: #f8f8f8;
            padding: 20px;
            text-align: center;
            border-radius: 8px;
        }
        .qr-placeholder {
            width: 140px;
            height: 140px;
            background-color: #ddd;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #888;
            font-size: 12px;
        }
        .qr-desc {
            font-size: 14px;
            color: #555;
        }

        /* --- 页脚 --- */
        .footer {
            padding: 30px;
            text-align: center;
            background-color: #f7f7f7;
            border-top: 1px solid #ededed;
        }
        .weui-footer__text {
            color: #999;
            font-size: 12px;
        }

        /* --- 移动端适配 (小于768px时) --- */
        @media (max-width: 768px) {
            .pc-container { max-width: 100%; box-shadow: none; }
            .header { padding: 15px; }
            .main-content { flex-direction: column; padding: 20px; }
            .sidebar { border-left: none; padding-left: 0; border-top: 1px solid #f0f0f0; padding-top: 20px;}
            .header .nav { display: none; } /* 移动端通常隐藏PC导航 */
        }
    </style>
</head>
<body>

<div class="pc-container">
    <div class="header">
        <div class="logo">
            <i class="weui-icon-success" style="margin-right:8px; font-size: 20px;"></i>
            微信生态页面
        </div>
        <div class="nav">
            <a href="#" class="active">首页</a>
            <a href="#">产品介绍</a>
            <a href="#">解决方案</a>
            <a href="#">关于我们</a>
        </div>
    </div>

    <div class="main-content">
        
        <div class="article-area">
            <h1 class="section-title">欢迎使用符合微信规范的 PC 页面</h1>
            
            <div class="card">
                <div class="card-meta">2023年10月24日 | 官方公告</div>
                <p>
                    这是一个基于 WeUI 风格设计的静态 HTML 页面。它采用了经典的灰白配色与微信绿（#07C160）作为点缀。在 PC 端微信浏览器访问时，能够给用户带来一致的视觉体验。
                </p>
                <a href="javascript:;" class="weui-btn weui-btn_primary" style="width: auto; display: inline-block; margin-top: 15px; padding: 8px 24px;">了解更多</a>
            </div>

            <div class="card">
                <h3 style="font-size: 18px; margin-bottom: 10px;">设计规范要点</h3>
                <p>
                    1. 字体优先使用系统默认字体，保证清晰度。<br>
                    2. 布局采用居中容器，防止在大屏显示器上内容过宽。<br>
                    3. 交互组件（如按钮、表单）复用 WeUI 样式。
                </p>
            </div>
        </div>

        <div class="sidebar">
            <div class="qr-box">
                <div class="qr-placeholder">
                    

[Image of QR Code]

                </div>
                <p class="qr-desc">微信扫一扫<br>关注公众号获取更多</p>
            </div>
            
            <div style="margin-top: 30px;">
                <h4 style="font-size: 14px; color: #333; margin-bottom: 10px;">常用链接</h4>
                <div class="weui-cell weui-cell_access" style="padding: 10px 0; border-bottom: 1px solid #eee;">
                    <div class="weui-cell__bd" style="font-size: 14px; color: #576b95;">开发文档</div>
                    <div class="weui-cell__ft"></div>
                </div>
                <div class="weui-cell weui-cell_access" style="padding: 10px 0;">
                    <div class="weui-cell__bd" style="font-size: 14px; color: #576b95;">设计指南</div>
                    <div class="weui-cell__ft"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div class="weui-footer">
            <p class="weui-footer__links">
                <a href="javascript:;" class="weui-footer__link">底部链接</a>
                <a href="javascript:;" class="weui-footer__link">联系我们</a>
            </p>
            <p class="weui-footer__text">Copyright &copy; 2008-2023 wechat.com</p>
            <p class="weui-footer__text" style="margin-top:5px;">ICP备12345678号</p>
        </div>
    </div>
</div>

</body>
</html>
